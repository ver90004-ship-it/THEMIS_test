<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>나와 어울리는 테미스 캐릭터는?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --bg-2:#ececec;
    --surface:#f5f5f5;
    --surface-2:#e7e7e7;
    --ink:#111111;
    --ink-dim:#6d6d6d;
    --btn-bg:#111111;
    --btn-fg:#ffffff;
    --btn-shadow:#000000;
    --hard-shadow:#111111;
    --paper:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#000000;
      --bg-2:#101010;
      --surface:#141414;
      --surface-2:#1e1e1e;
      --ink:#f2f2f2;
      --ink-dim:#9a9a9a;
      --btn-bg:#f2f2f2;
      --btn-fg:#000000;
      --btn-shadow:#4a4a4a;
      --hard-shadow:#3d3d3d;
      --paper:#f2f2f2;
    }
  }
  :root[data-theme="dark"]{
    --bg:#000000;
    --bg-2:#101010;
    --surface:#141414;
    --surface-2:#1e1e1e;
    --ink:#f2f2f2;
    --ink-dim:#9a9a9a;
    --btn-bg:#f2f2f2;
    --btn-fg:#000000;
    --btn-shadow:#4a4a4a;
    --hard-shadow:#3d3d3d;
    --paper:#f2f2f2;
  }

  *{ box-sizing:border-box; }
  html{
    background:var(--bg);
    -webkit-text-size-adjust:100%;
    scrollbar-width:none;
    -ms-overflow-style:none;
  }
  ::-webkit-scrollbar{ width:0; height:0; background:transparent; }
  body{
    margin:0;
    min-height:100dvh;
    background:
      radial-gradient(ellipse 120% 60% at 50% 0%, var(--bg), var(--bg-2) 100%);
    color:var(--ink);
    font-family:"Noto Sans KR","Malgun Gothic",sans-serif;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }

  .app{
    width:100%;
    max-width:440px;
    min-height:100dvh;
    padding:24px 18px 36px;
    display:flex;
    flex-direction:column;
  }

  .screen{
    margin-block:auto;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }
  [hidden]{ display:none !important; }

  /* -------- shared -------- */
  button{ font:inherit; touch-action:manipulation; }

  .btn-dark{
    margin-top:24px;
    width:100%;
    max-width:340px;
    background:var(--btn-bg);
    color:var(--btn-fg);
    border:none;
    border-radius:14px;
    padding:16px 20px;
    font-family:"Jua",sans-serif;
    font-size:18px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--btn-shadow);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .btn-dark:active{ transform:translateY(3px); box-shadow:0 2px 0 var(--btn-shadow); }
  .btn-dark:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
  .btn-dark .btn-sub{
    display:block; font-family:"Noto Sans KR",sans-serif; font-weight:500;
    font-size:11.5px; opacity:.72; margin-top:6px; letter-spacing:.01em;
  }

  .btn-outline{
    margin-top:10px;
    width:100%;
    max-width:340px;
    background:transparent;
    color:var(--ink);
    border:2.5px solid var(--ink);
    border-radius:14px;
    padding:13px 20px;
    font-family:"Jua",sans-serif;
    font-size:15.5px;
    cursor:pointer;
  }
  .btn-outline:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }

  /* -------- cover -------- */
  .cover-frame{
    display:flex;
    justify-content:center;
    width:100%;
  }
  .cover-frame img{
    display:block;
    width:100%;
    background:var(--paper);
    border:3px solid var(--ink);
    border-radius:18px;
    box-shadow:6px 6px 0 var(--hard-shadow);
  }

  /* -------- quiz -------- */
  .progress-text{
    font-family:"Jua",sans-serif;
    font-size:15px;
    color:var(--ink-dim);
    margin:0;
    letter-spacing:.06em;
  }
  .q-bubble{
    margin-top:16px;
    width:100%;
    max-width:340px;
    background:var(--surface);
    border:3px solid var(--ink);
    border-radius:24px 28px 22px 30px;
    padding:28px 20px;
    box-shadow:4px 4px 0 var(--hard-shadow);
  }
  .q-text{
    font-family:"Jua",sans-serif;
    font-size:clamp(18px,5vw,21px);
    line-height:1.5;
    color:var(--ink);
    margin:0;
    text-wrap:balance;
  }
  .answers{
    display:flex; flex-direction:column; gap:12px;
    margin-top:24px; width:100%; max-width:340px;
  }
  .answer-btn{
    background:var(--btn-bg);
    color:var(--btn-fg);
    border:none;
    border-radius:13px;
    padding:16px 16px;
    min-height:54px;
    font-family:"Noto Sans KR",sans-serif;
    font-weight:700;
    font-size:15px;
    line-height:1.45;
    cursor:pointer;
    box-shadow:0 4px 0 var(--btn-shadow);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  .answer-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--btn-shadow); }
  .answer-btn:focus-visible{ outline:2px solid var(--ink); outline-offset:3px; }
  .link-back{
    margin-top:16px; background:none; border:none;
    color:var(--ink-dim); font-family:"Noto Sans KR",sans-serif;
    font-size:13px; cursor:pointer; padding:8px 12px;
  }

  /* -------- loading -------- */
  .loading-dots{ display:flex; gap:11px; }
  .loading-dots span{
    width:13px; height:13px; border-radius:50%;
    background:var(--ink);
    animation:bounce 1s infinite ease-in-out;
  }
  .loading-dots span:nth-child(2){ animation-delay:.15s; }
  .loading-dots span:nth-child(3){ animation-delay:.3s; }
  @keyframes bounce{
    0%,80%,100%{ transform:translateY(0); opacity:.35; }
    40%{ transform:translateY(-9px); opacity:1; }
  }
  .loading-text{
    margin:18px 0 0; font-family:"Jua",sans-serif;
    font-size:17px; color:var(--ink);
  }
  .loading-sub{
    margin:6px 0 0; font-family:"Noto Sans KR",sans-serif;
    font-size:12.5px; color:var(--ink-dim);
  }

  /* -------- result -------- */
  .user-type-label{
    margin:0;
    font-family:"Noto Sans KR",sans-serif;
    font-size:13px;
    color:var(--ink-dim);
  }
  .user-type-label b{
    font-family:"Jua",sans-serif;
    font-size:17px;
    color:var(--ink);
    letter-spacing:.08em;
    margin-left:5px;
  }
  .section-eyebrow{
    margin:16px 0 0;
    font-family:"Jua",sans-serif; font-size:13.5px; color:var(--ink);
    background:var(--surface-2); border:2px solid var(--ink); border-radius:999px;
    padding:6px 15px;
  }
  .result-card{ margin-top:14px; width:100%; }
  .result-img{
    width:100%; display:block;
    background:var(--paper);
    border-radius:18px; border:3px solid var(--ink);
    box-shadow:5px 5px 0 var(--hard-shadow);
  }

  .compare-row{
    display:flex; gap:14px; margin-top:26px;
    width:100%;
  }
  .compare-item{ flex:1; display:flex; flex-direction:column; align-items:center; min-width:0; }
  .compare-label{
    font-family:"Jua",sans-serif; font-size:12.5px; color:var(--ink);
    background:var(--surface-2); border:2px solid var(--ink); border-radius:999px;
    padding:5px 10px; margin:0 0 12px; white-space:nowrap;
  }
  .compare-thumb{
    width:clamp(84px,26vw,108px);
    aspect-ratio:1;
    object-fit:cover; border-radius:50%;
    background:var(--paper);
    border:3px solid var(--ink); box-shadow:3px 3px 0 var(--hard-shadow);
  }
  .compare-caption{
    margin:12px 0 0; font-family:"Noto Sans KR",sans-serif;
    font-size:12px; line-height:1.5; color:var(--ink-dim); font-weight:500;
  }
  .compare-caption b{
    display:block; font-family:"Jua",sans-serif; font-size:15px;
    color:var(--ink); margin-top:2px;
  }

  /* -------- all characters -------- */
  .all-title{ font-family:"Jua",sans-serif; font-size:20px; margin:0; }
  .all-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:12px;
    margin-top:18px; width:100%;
  }
  .all-card{
    background:var(--surface); border:2.5px solid var(--ink); border-radius:14px;
    padding:14px 8px; display:flex; flex-direction:column; align-items:center;
    box-shadow:3px 3px 0 var(--hard-shadow);
  }
  .all-card img{
    width:64px; height:64px; object-fit:cover; border-radius:50%;
    background:var(--paper);
    border:2.5px solid var(--ink);
  }
  .all-card p{ margin:8px 0 0; font-family:"Jua",sans-serif; font-size:13px; }
  .all-card .type{
    font-family:"Noto Sans KR",sans-serif; font-size:11px;
    color:var(--ink-dim); margin-top:2px; font-weight:700; letter-spacing:.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .loading-dots span{ animation:none; }
    .btn-dark, .answer-btn{ transition:none; }
  }

  @media (max-width:360px){
    .app{ padding:18px 14px 30px; }
    .btn-dark{ font-size:17px; }
  }
</style>
</head>
<body>

<div class="app">

  <!-- COVER -->
  <section class="screen" id="screenCover">
    <div class="cover-frame">
      <img src="images/cover.png" alt="나와 잘 맞는 테미스 캐릭터는?">
    </div>
    <button class="btn-dark" id="startBtn">시작하기<span class="btn-sub">닮은 캐릭터 · 영혼의 단짝 · 안 맞는 캐릭터</span></button>
  </section>

  <!-- QUIZ -->
  <section class="screen" id="screenQuiz" hidden>
    <p class="progress-text" id="progressText">1 / 12</p>
    <div class="q-bubble">
      <p class="q-text" id="qText"></p>
    </div>
    <div class="answers" id="answersWrap"></div>
    <button class="link-back" id="backBtn" hidden>← 이전 질문</button>
  </section>

  <!-- LOADING -->
  <section class="screen" id="screenLoading" hidden>
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <p class="loading-text">테미스 유형 찾는 중</p>
    <p class="loading-sub">에코 파장 매칭 중...</p>
  </section>

  <!-- RESULT -->
  <section class="screen" id="screenResult" hidden>
    <p class="user-type-label">당신의 에코 유형 <b id="typeBadge"></b></p>
    <p class="section-eyebrow">≈ 나와 닮은 캐릭터</p>

    <div class="result-card">
      <img class="result-img" id="resultImg" src="" alt="">
    </div>

    <div class="compare-row">
      <div class="compare-item">
        <p class="compare-label">잘 맞는... 캐릭터</p>
        <img class="compare-thumb" id="soulThumb" src="" alt="">
        <p class="compare-caption" id="soulCaption"></p>
      </div>
      <div class="compare-item">
        <p class="compare-label">안 맞는... 캐릭터</p>
        <img class="compare-thumb" id="clashThumb" src="" alt="">
        <p class="compare-caption" id="clashCaption"></p>
      </div>
    </div>

    <button class="btn-dark" id="retryBtn">다시 테스트하기</button>
    <button class="btn-outline" id="allBtn">전체 캐릭터 보기</button>
  </section>

  <!-- ALL CHARACTERS -->
  <section class="screen" id="screenAll" hidden>
    <p class="all-title">테미스 캐릭터 7</p>
    <div class="all-grid" id="allGrid"></div>
    <button class="btn-outline" id="closeAllBtn">결과로 돌아가기</button>
  </section>

</div>

<script>
(function(){
  var axesMeta = {
    EI: { left:'E', right:'I' },
    SN: { left:'S', right:'N' },
    TF: { left:'T', right:'F' },
    JP: { left:'J', right:'P' }
  };
  var axisOrder = ['EI','SN','TF','JP'];

  var questions = [
    { text:"낯선 모임에 들어갔을 때 나는",
      opts:[ {t:"먼저 말을 걸고 분위기를 주도한다", l:'E'}, {t:"구석에서 상황을 지켜보다 필요할 때만 움직인다", l:'I'} ] },
    { text:"정보를 받아들일 때 나는",
      opts:[ {t:"눈앞의 사실과 디테일을 먼저 본다", l:'S'}, {t:"숨겨진 의미와 가능성을 먼저 본다", l:'N'} ] },
    { text:"친구가 힘든 일을 털어놓으면",
      opts:[ {t:"원인을 분석하고 해결책부터 제시한다", l:'T'}, {t:"일단 감정에 공감하며 곁에 있어준다", l:'F'} ] },
    { text:"여행 계획을 짤 때 나는",
      opts:[ {t:"일정과 동선을 미리 다 짜놓는다", l:'J'}, {t:"그때그때 끌리는 대로 움직인다", l:'P'} ] },
    { text:"에너지를 얻는 방식은",
      opts:[ {t:"사람들과 부대끼며 활기를 얻는다", l:'E'}, {t:"혼자만의 시간에서 회복한다", l:'I'} ] },
    { text:"계획을 세울 때 나는",
      opts:[ {t:"실제 경험과 데이터에 기반해서 짠다", l:'S'}, {t:"아직 없는 가능성과 직감을 따라간다", l:'N'} ] },
    { text:"결정을 내릴 때 우선순위는",
      opts:[ {t:"논리와 효율", l:'T'}, {t:"감정과 관계", l:'F'} ] },
    { text:"마감이 다가오면 나는",
      opts:[ {t:"미리미리 끝내야 마음이 편하다", l:'J'}, {t:"닥쳐야 몰입이 되고 결국 해낸다", l:'P'} ] },
    { text:"시끄러운 곳과 조용한 곳 중",
      opts:[ {t:"정적인 상황이 오히려 답답하다", l:'E'}, {t:"시끄러운 곳은 금방 지친다", l:'I'} ] },
    { text:"대화할 때 나는 주로",
      opts:[ {t:"구체적인 사례와 지금 상황을 이야기한다", l:'S'}, {t:"비유와 앞으로 벌어질 일을 이야기한다", l:'N'} ] },
    { text:"비판을 받으면 나는",
      opts:[ {t:"타당하면 받아들이고 바로 고친다", l:'T'}, {t:"마음이 먼저 다치고 그다음 생각한다", l:'F'} ] },
    { text:"내 방이나 작업 공간은",
      opts:[ {t:"정리정돈이 되어 있어야 마음이 편하다", l:'J'}, {t:"어질러져 있어도 필요한 건 다 찾는다", l:'P'} ] }
  ];

  var chars = [
    { key:'zeon', type:'ISTJ', full:'제온 · 봉제사',
      big:'images/zeon-big.png', thumb:'images/zeon-thumb.jpg',
      adj:'체계를 사랑하는', label:'봉제사' },
    { key:'svik', type:'ENTP', full:'스빅 · 만화경',
      big:'images/svik-big.png', thumb:'images/svik-thumb.jpg',
      adj:'혼돈을 즐기는', label:'만화경' },
    { key:'kan', type:'INTJ', full:'칸 · 칼잠',
      big:'images/kan-big.png', thumb:'images/kan-thumb.jpg',
      adj:'빈틈이 없는', label:'칼잠' },
    { key:'haerok', type:'ESTP', full:'해록 · 바다이빨',
      big:'images/haerok-big.png', thumb:'images/haerok-thumb.jpg',
      adj:'포식 본능 넘치는', label:'바다이빨' },
    { key:'ion', type:'ISTP', full:'서태윤 · 이온',
      big:'images/ion-big.png', thumb:'images/ion-thumb.jpg',
      adj:'까칠한 파도', label:'이온' },
    { key:'morfeo', type:'INFP', full:'이현강 · 모르페오',
      big:'images/morfeo-big.png', thumb:'images/morfeo-thumb.jpg',
      adj:'몽환에 잠긴', label:'모르페오' },
    { key:'kassan', type:'ENTJ', full:'송요한 · 카산',
      big:'images/kassan-big.png', thumb:'images/kassan-thumb.jpg',
      adj:'우아한 완벽주의', label:'카산' }
  ];

  var state = { i:0, log:[] };

  var screenCover = document.getElementById('screenCover');
  var screenQuiz = document.getElementById('screenQuiz');
  var screenLoading = document.getElementById('screenLoading');
  var screenResult = document.getElementById('screenResult');
  var screenAll = document.getElementById('screenAll');

  var qText = document.getElementById('qText');
  var answersWrap = document.getElementById('answersWrap');
  var progressText = document.getElementById('progressText');
  var backBtn = document.getElementById('backBtn');

  function toTop(){ window.scrollTo(0, 0); }

  document.getElementById('startBtn').addEventListener('click', function(){
    screenCover.hidden = true;
    screenQuiz.hidden = false;
    renderQuestion();
    toTop();
  });

  backBtn.addEventListener('click', function(){
    if(state.i === 0) return;
    state.i -= 1;
    state.log.pop();
    renderQuestion();
    toTop();
  });

  function renderQuestion(){
    var q = questions[state.i];
    progressText.textContent = (state.i + 1) + ' / ' + questions.length;
    qText.textContent = q.text;
    answersWrap.innerHTML = '';
    q.opts.forEach(function(opt){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'answer-btn';
      btn.textContent = opt.t;
      btn.addEventListener('click', function(){ choose(opt.l); });
      answersWrap.appendChild(btn);
    });
    backBtn.hidden = state.i === 0;
  }

  function choose(letter){
    state.log.push(letter);
    if(state.i < questions.length - 1){
      state.i += 1;
      renderQuestion();
      toTop();
    } else {
      screenQuiz.hidden = true;
      screenLoading.hidden = false;
      toTop();
      window.setTimeout(function(){
        screenLoading.hidden = true;
        showResult();
        toTop();
      }, 1100);
    }
  }

  function matchInfo(charType, resultLetters, margin){
    var matchCount = 0, marginSum = 0;
    axisOrder.forEach(function(ax, ai){
      if(charType[ai] === resultLetters[ax]){ matchCount += 1; marginSum += margin[ax]; }
    });
    return { matchCount:matchCount, marginSum:marginSum };
  }

  function pickResults(resultLetters, margin){
    var scored = chars.map(function(c, idx){
      var m = matchInfo(c.type, resultLetters, margin);
      return { c:c, matchCount:m.matchCount, marginSum:m.marginSum, idx:idx };
    });

    var byMatchDesc = scored.slice().sort(function(a,b){
      if(b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
      if(b.marginSum !== a.marginSum) return b.marginSum - a.marginSum;
      return a.idx - b.idx;
    });
    var twin = byMatchDesc[0].c;

    var soulPool = scored.filter(function(s){ return s.c.key !== twin.key; }).map(function(s){
      var coreMatch = 0, coreMarginSum = 0;
      ['SN','TF','JP'].forEach(function(ax){
        var ai = axisOrder.indexOf(ax);
        if(s.c.type[ai] === resultLetters[ax]){ coreMatch += 1; coreMarginSum += margin[ax]; }
      });
      var eiContrast = s.c.type[0] !== resultLetters.EI ? 1 : 0;
      return { s:s, compat: coreMatch + eiContrast * 0.5, coreMarginSum: coreMarginSum };
    });
    soulPool.sort(function(a,b){
      if(b.compat !== a.compat) return b.compat - a.compat;
      if(b.coreMarginSum !== a.coreMarginSum) return b.coreMarginSum - a.coreMarginSum;
      return a.s.idx - b.s.idx;
    });
    var soulmate = soulPool[0].s.c;

    var worstPool = scored.filter(function(s){ return s.c.key !== twin.key && s.c.key !== soulmate.key; });
    worstPool.sort(function(a,b){
      if(a.matchCount !== b.matchCount) return a.matchCount - b.matchCount;
      if(a.marginSum !== b.marginSum) return a.marginSum - b.marginSum;
      return a.idx - b.idx;
    });
    var clash = worstPool[0].c;

    return { twin:twin, soulmate:soulmate, clash:clash };
  }

  function showResult(){
    var counts = { E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0 };
    state.log.forEach(function(l){ counts[l] += 1; });

    var resultLetters = {};
    var margin = {};
    axisOrder.forEach(function(ax){
      var L = axesMeta[ax].left, R = axesMeta[ax].right;
      resultLetters[ax] = counts[L] >= counts[R] ? L : R;
      margin[ax] = Math.abs(counts[L] - counts[R]);
    });
    var resultType = axisOrder.map(function(ax){ return resultLetters[ax]; }).join('');

    var picks = pickResults(resultLetters, margin);

    screenResult.hidden = false;

    document.getElementById('typeBadge').textContent = resultType;
    document.getElementById('resultImg').src = picks.twin.big;
    document.getElementById('resultImg').alt = picks.twin.full;

    document.getElementById('soulThumb').src = picks.soulmate.thumb;
    document.getElementById('soulThumb').alt = picks.soulmate.full;
    document.getElementById('soulCaption').innerHTML = picks.soulmate.adj + '<b>' + picks.soulmate.label + '</b>';

    document.getElementById('clashThumb').src = picks.clash.thumb;
    document.getElementById('clashThumb').alt = picks.clash.full;
    document.getElementById('clashCaption').innerHTML = picks.clash.adj + '<b>' + picks.clash.label + '</b>';

    var allGrid = document.getElementById('allGrid');
    allGrid.innerHTML = '';
    chars.forEach(function(c){
      var card = document.createElement('div');
      card.className = 'all-card';
      card.innerHTML =
        '<img src="' + c.thumb + '" alt="' + c.full + '">' +
        '<p>' + c.label + '</p>' +
        '<p class="type">' + c.type + '</p>';
      allGrid.appendChild(card);
    });
  }

  document.getElementById('retryBtn').addEventListener('click', function(){
    state = { i:0, log:[] };
    screenResult.hidden = true;
    screenCover.hidden = false;
    toTop();
  });

  document.getElementById('allBtn').addEventListener('click', function(){
    screenResult.hidden = true;
    screenAll.hidden = false;
    toTop();
  });
  document.getElementById('closeAllBtn').addEventListener('click', function(){
    screenAll.hidden = true;
    screenResult.hidden = false;
    toTop();
  });
})();
</script>

</body>
</html>
